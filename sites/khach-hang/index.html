<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khách hàng & công nợ</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;color:#172033;margin:0;padding:4px}h1{font-size:24px;margin:6px 0 2px}.mut{color:#5b6980;font-size:13px}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.k{background:#fff;border:1px solid #e3e8f0;border-radius:12px;padding:12px 14px}.k b{display:block;font-size:20px;margin-top:2px}
.g{display:grid;grid-template-columns:330px 1fr;gap:12px;align-items:start}@media(max-width:900px){.g,.top{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:14px}input,select,button,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd8e6;border-radius:9px;background:#fff}
button{font-weight:600;cursor:pointer}button.p{background:#1f5fd6;color:#fff;border-color:#1f5fd6}button.x{color:#d4472a}
#list{max-height:70vh;overflow:auto;margin-top:8px}.it{padding:9px 8px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f0f3f8}.it:hover{background:#f4f7fc}.it.on{background:#e8f0fe}.it small{color:#5b6980;display:block}
.debt{color:#d4472a;font-weight:700;white-space:nowrap}.ok{color:#16915f;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:7px 5px;border-top:1px solid #eef1f6;text-align:left}th{color:#5b6980;font-size:12px}.r{text-align:right}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}.kp div{background:#f6f8fc;border-radius:10px;padding:9px 11px}.kp b{display:block;font-size:17px}
.tabs button{margin:8px 6px 8px 0}.tabs .on{background:#e8f0fe;border-color:#1f5fd6;color:#1f5fd6}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row input{min-width:0}
dialog{border:0;border-radius:16px;padding:20px;width:min(640px,94vw);box-shadow:0 20px 60px rgba(20,30,60,.3)}dialog::backdrop{background:rgba(20,30,60,.45)}.dg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:10px}.dg .w2{grid-column:1/-1}@media(max-width:560px){.dg{grid-template-columns:1fr}}#msg{position:fixed;right:14px;bottom:14px;background:#172033;color:#fff;padding:10px 14px;border-radius:10px;display:none}.f label{display:block;margin:6px 0;font-size:13px;color:#5b6980}.f input,.f textarea{width:100%}
</style></head><body>
<h1>Khách hàng & công nợ</h1><div class="mut">Công nợ = nợ đầu kỳ + báo giá đã chốt/đã xuất kho − đã thanh toán.</div>
<div class="top"><div class="k"><span class="mut">Tổng phải thu</span><b id="kDebt">…</b></div><div class="k"><span class="mut">Khách còn nợ</span><b id="kN">…</b></div><div class="k"><span class="mut">Doanh số đã chốt</span><b id="kSales">…</b></div></div>
<div class="g"><div class="card"><div class="row"><input id="q" placeholder="Tìm tên, số điện thoại" style="flex:1"><button class="p" id="add" hidden>＋</button></div>
<div class="row"><select id="sort"><option value="debt">Nợ cao nhất</option><option value="name">Tên A–Z</option><option value="recent">Mua gần nhất</option></select><label><input type="checkbox" id="onlyDebt"> Chỉ khách còn nợ</label></div><div id="list"></div></div>
<div class="card" id="panel"><p class="mut">Chọn một khách hàng ở bên trái để xem hồ sơ.</p></div></div><dialog id="dlg"><div class="dh"><h2 id="dTitle" style="margin:0;font-size:20px"></h2></div><div class="f dg">
<label class="w2">Tên khách hàng / đơn vị *<input id="d_name"></label><label>Mã khách hàng<input id="d_code"></label><label>Số điện thoại<input id="d_phone" placeholder="VD: 0905 123 456"></label>
<label>Người liên hệ<input id="d_contact"></label><label>Email<input id="d_email" type="email"></label><label>Mã số thuế<input id="d_tax_code"></label><label>Nợ đầu kỳ (đ)<input id="d_opening_debt" type="number" step="1000"></label>
<label class="w2">Địa chỉ<input id="d_address"></label><label class="w2">Ghi chú<textarea id="d_note" rows="2"></textarea></label></div>
<p id="dErr" class="debt" style="margin:6px 0"></p><div style="text-align:right"><button type="button" id="dNo">Hủy</button> <button type="button" class="p" id="dOk">Lưu khách hàng</button></div></dialog>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../../config.js"></script><script src="../../assets/js/bridge.js" data-route="khach-hang"></script>
<script>
(async()=>{
const $=id=>document.getElementById(id),sb=window.HHH&&HHH.sb;if(!sb){document.body.innerHTML='Không kết nối được Supabase.';return}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('vi-VN'),dt=d=>d?new Date(d).toLocaleDateString('vi-VN'):'—';
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const ST=HHH.ST,MAN=['draft','confirmed','cancelled'];
const role=(await sb.rpc('my_role')).data,boss=role==='admin'||role==='approver',canW=boss||role==='staff';
let rows=[],cur=null,tab='q',D={q:[],p:[]};
const toast=m=>{const e=$('msg');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3800)};
async function all(t,sel,f){let a=[],i=0;for(;;){let q=sb.from(t).select(sel);if(f)q=f(q);const r=await q.range(i,i+999);if(r.error)throw r.error;a=a.concat(r.data);if(r.data.length<1000)break;i+=1000}return a}
async function loadList(){try{rows=await all('customer_balances','*',q=>q.order('id'))}catch(e){$('list').innerHTML='<p class="debt">Chưa tải được: '+esc(e.message)+'<br>Hãy chạy supabase-update-8.sql.</p>';return}
 $('kDebt').textContent=fmt(rows.reduce((a,r)=>a+Math.max(0,+r.debt),0))+' đ';$('kN').textContent=rows.filter(r=>+r.debt>0).length;$('kSales').textContent=fmt(rows.reduce((a,r)=>a+ +r.sales,0))+' đ';drawList()}
function drawList(){const q=nrm($('q').value),od=$('onlyDebt').checked,s=$('sort').value;
 let l=rows.filter(r=>(!od||+r.debt>0)&&(!q||nrm(r.name+' '+r.phone).includes(q)));
 l.sort(s==='name'?(a,b)=>a.name.localeCompare(b.name,'vi'):s==='recent'?(a,b)=>String(b.last_quote||'').localeCompare(String(a.last_quote||'')):(a,b)=>b.debt-a.debt);
 $('list').innerHTML=l.slice(0,300).map(r=>`<div class="it${cur&&cur.id===r.id?' on':''}" data-id="${r.id}"><div>${esc(r.name)}<small>${esc(r.phone||'')} · ${r.all_quotes} báo giá</small></div><span class="${+r.debt>0?'debt':'ok'}">${+r.debt>0?fmt(r.debt):'Hết nợ'}</span></div>`).join('')||'<p class="mut">Không có khách phù hợp.</p>'}
$('list').onclick=e=>{const d=e.target.closest('.it');if(d)open(+d.dataset.id)};$('q').oninput=$('onlyDebt').onchange=$('sort').onchange=drawList;
async function open(id,keep){cur=rows.find(r=>r.id===id);if(!cur)return;if(!keep)tab='q';drawList();$('panel').innerHTML='<p class="mut">Đang tải…</p>';
 const [q,p,o]=await Promise.all([sb.from('quotes').select('code,total,status,updated_at,payload,returned_amount,returns').eq('customer_id',id).order('updated_at',{ascending:false}),sb.from('customer_payments').select('*').eq('customer_id',id).order('paid_at',{ascending:false}).order('id',{ascending:false}),sb.rpc('customer_image_orders',{p_customer:id})]);
 D.q=q.data||[];D.p=p.data||[];D.o=o.error?[]:(o.data||[]);D.oErr=o.error?o.error.message:'';draw()}
const qdate=x=>(x.payload&&x.payload.quote&&x.payload.quote.date)||x.updated_at,sold=x=>x.status==='exported'||x.status==='returned';
function draw(){const c=cur;
 $('panel').innerHTML=`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(c.name)}</h2><div class="mut">${esc(c.phone||'chưa có SĐT')} · ${esc(c.address||'chưa có địa chỉ')}</div>${(c.contact||c.email||c.tax_code)?`<div class=\"mut\">${[c.contact&&'Liên hệ: '+esc(c.contact),c.email&&esc(c.email),c.tax_code&&'MST: '+esc(c.tax_code)].filter(Boolean).join(' · ')}</div>`:''}${c.note?`<div class="mut">Ghi chú: ${esc(c.note)}</div>`:''}</div><div><button id="bPrint">In đối chiếu công nợ</button> ${boss?'<button id="bEdit">Sửa</button>':''}</div></div>
 <div class="kp"><div><span class="mut">Công nợ hiện tại</span><b class="${+c.debt>0?'debt':'ok'}">${fmt(c.debt)} đ</b></div><div><span class="mut">Tổng mua (báo giá + phiếu xuất ảnh đã duyệt, trừ hoàn)</span><b>${fmt(c.sales)} đ</b></div><div><span class="mut">Đã thanh toán</span><b>${fmt(c.paid)} đ</b></div><div><span class="mut">Nợ đầu kỳ</span><b>${fmt(c.opening_debt)} đ</b></div><div><span class="mut">Lần mua gần nhất</span><b>${dt(c.last_quote)}</b></div><div><span class="mut">Thanh toán gần nhất</span><b>${dt(c.last_paid)}</b></div></div>
 <div class="tabs"><button data-t="q" class="${tab==='q'?'on':''}">Báo giá (${D.q.length})</button><button data-t="p" class="${tab==='p'?'on':''}">Thanh toán (${D.p.length})</button><button data-t="o" class="${tab==='o'?'on':''}">Phiếu xuất ảnh (${D.o.length})</button><button data-t="i" class="${tab==='i'?'on':''}">Hàng đã mua</button></div><div id="tc"></div>`;
 $('panel').querySelector('.tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
 $('bPrint').onclick=printLedger;if($('bEdit'))$('bEdit').onclick=editForm;
 const tc=$('tc');
 if(tab==='q')tc.innerHTML=`<table><tr><th>Mã</th><th>Ngày</th><th class="r">Giá trị</th><th>Trạng thái</th></tr>${D.q.map(x=>`<tr><td>${esc(x.code)}</td><td>${dt(qdate(x))}</td><td class="r">${fmt(x.total)}${+x.returned_amount?`<br><small class="ok">− hoàn ${fmt(x.returned_amount)}</small>`:''}</td><td>${MAN.includes(x.status)?`<select data-c="${esc(x.code)}"${canW?'':' disabled'}>${MAN.map(k=>`<option value="${k}"${x.status===k?' selected':''}>${ST[k]}</option>`).join('')}</select>`:`<b>${esc(HHH.stLabel(x.status,x.total,x.returned_amount))}</b>`}${(x.returns||[]).map(h=>`<div class="mut"><small>${dt(h.at)} · ${h.source==='void'?'hủy xuất ở kho':'phiếu hoàn'} · trừ nợ ${fmt(h.amount)} đ: ${(h.lines||[]).map(l=>esc(l.code)+' × '+fmt(l.qty)).join(', ')}${h.note?' · '+esc(h.note):''}</small></div>`).join('')}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Chưa có báo giá.</td></tr>'}</table><p class="mut">Chỉ báo giá “Đã xuất kho” (phiếu xuất đã được kho duyệt) mới tính vào công nợ, trừ đi phần hoàn kho (hủy dòng xuất ở kho hoặc phiếu hoàn đã duyệt). Hoàn đủ hàng đã xuất → “Đã hoàn kho”, nợ của đơn về 0, xóa được. Trạng thái xuất kho / hoàn kho do kho cập nhật, không đổi tay. Hoàn kho: mở báo giá → “Tồn kho / Xuất kho”.</p>`;
 if(tab==='q')tc.onchange=async e=>{const s=e.target.dataset.c;if(!s)return;const r=await sb.from('quotes').update({status:e.target.value}).eq('code',s);if(r.error)return toast('Không đổi được: '+r.error.message);toast('Đã cập nhật trạng thái');await loadList();open(c.id,1)};
 if(tab==='p'){tc.onchange=null;tc.innerHTML=(canW?`<div class="row f"><input type="date" id="pd" value="${new Date().toISOString().slice(0,10)}"><input type="number" id="pa" placeholder="Số tiền" step="1000"><select id="pm"><option>Tiền mặt</option><option>Chuyển khoản</option><option>Khác</option></select><select id="pq"><option value="">Không gắn báo giá</option>${D.q.filter(sold).map(x=>`<option>${esc(x.code)}</option>`).join('')}</select><input id="pn" placeholder="Ghi chú" style="flex:1"><button class="p" id="pOk">Ghi nhận</button></div>`:'')+`<table><tr><th>Ngày</th><th class="r">Số tiền</th><th>Hình thức</th><th>Báo giá</th><th>Ghi chú</th><th></th></tr>${D.p.map(x=>`<tr><td>${dt(x.paid_at)}</td><td class="r">${fmt(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.quote_code||'')}</td><td>${esc(x.note)}</td><td>${boss?`<button class="x" data-del="${x.id}">Xóa</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Chưa có khoản thanh toán.</td></tr>'}</table>`;
  if($('pOk'))$('pOk').onclick=async()=>{const a=Number($('pa').value);if(!a)return toast('Nhập số tiền');const r=await sb.from('customer_payments').insert({customer_id:c.id,amount:a,paid_at:$('pd').value,method:$('pm').value,quote_code:$('pq').value||null,note:$('pn').value.trim()});if(r.error)return toast('Không lưu được: '+r.error.message);toast('Đã ghi nhận thanh toán');await loadList();open(c.id,1)};
  tc.onclick=async e=>{const d=e.target.dataset.del;if(!d||!confirm('Xóa khoản thanh toán này?'))return;const r=await sb.from('customer_payments').delete().eq('id',d);if(r.error)return toast(r.error.message);await loadList();open(c.id,1)}}
 if(tab==='o'){tc.onchange=tc.onclick=null;const sv={pending:'Chờ duyệt (chưa tính nợ)',approved:'Đã duyệt'};
  tc.innerHTML=D.oErr?`<p class="debt">Chưa tải được: ${esc(D.oErr)}<br>Hãy chạy supabase-update-15.sql.</p>`:`<table><tr><th>Ngày</th><th>Phiếu</th><th class="r">Giá trị</th><th class="r">Hoàn (hủy xuất)</th><th class="r">Còn nợ</th><th>Trạng thái</th></tr>${D.o.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.party||'')}${x.doc_date?'<br><small class="mut">phiếu '+esc(x.doc_date)+'</small>':''}</td><td class="r">${fmt(x.value)}</td><td class="r">${+x.adjusted?'− '+fmt(x.adjusted):''}</td><td class="r">${x.status==='approved'?fmt(x.net):'<span class="mut">0</span>'}</td><td>${sv[x.status]||esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Chưa có phiếu xuất ảnh nào được tính công nợ cho khách này.</td></tr>'}</table><p class="mut">Phiếu xuất kho từ ảnh được gán khách ngay lúc xuất (hoặc gán sau ở kho: Chờ duyệt → Đã xử lý → “Gán công nợ”). Chỉ phiếu đã duyệt mới tính vào công nợ; hủy dòng xuất ở Lịch sử kho sẽ trừ lại theo tỷ lệ giá trị dòng.</p>`}
 if(tab==='i'){tc.onchange=tc.onclick=null;const m=new Map();D.q.filter(sold).forEach(x=>{const P=x.payload||{};[...(P.aluminum||[]).map(l=>({...l,v:(+l.qty||0)*(+l.weight||0)*(+l.price||0)})),...(P.accessoriesIncluded===false?[]:(P.accessories||[]).map(l=>({...l,v:(+l.qty||0)*(+l.price||0)*(1-Math.min(100,+l.discountPercent||0)/100)})))].forEach(l=>{const k=(l.code||l.name)+'|'+(l.color||'');const o=m.get(k)||{code:l.code,name:l.name,color:l.color||'',unit:l.unit,q:0,v:0,last:''};o.q+=+l.qty||0;o.v+=l.v;if(qdate(x)>o.last)o.last=qdate(x);m.set(k,o)})});
  tc.innerHTML=`<table><tr><th>Mã / tên</th><th class="r">Số lượng</th><th class="r">Giá trị</th><th>Mua gần nhất</th></tr>${[...m.values()].sort((a,b)=>b.v-a.v).map(o=>`<tr><td><b>${esc(o.code)}</b><br><span class="mut">${esc(o.name)}${o.color?' · '+esc(o.color):''}</span></td><td class="r">${fmt(o.q)} ${esc(o.unit||'')}</td><td class="r">${fmt(o.v)}</td><td>${dt(o.last)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Chưa có hàng đã xuất kho.</td></tr>'}</table><p class="mut">Giá trị tính theo từng dòng của báo giá đã xuất kho, chưa gồm chiết khấu chung, VAT và hàng hoàn kho (xem ở tab Báo giá).</p>`}}
const FLD=['name','code','phone','contact','email','tax_code','address','opening_debt','note'];
function showForm(c){$('dTitle').textContent=c?'Sửa thông tin khách hàng':'Thêm khách hàng mới';
 FLD.forEach(k=>$('d_'+k).value=c?(c[k]??''):(k==='opening_debt'?'0':''));$('dErr').textContent='';$('dlg').showModal();$('d_name').focus();
 $('dOk').onclick=async()=>{const v={};FLD.forEach(k=>v[k]=$('d_'+k).value.trim());
  if(!v.name){$('dErr').textContent='Vui lòng nhập tên khách hàng.';return}
  v.opening_debt=Number(v.opening_debt)||0;
  if(!c){const dg=s=>(String(s).match(/\d{9,11}/g)||[]),ph=dg(v.phone);
   const dup=rows.find(r=>nrm(r.name).replace(/\s+/g,' ').trim()===nrm(v.name).replace(/\s+/g,' ').trim()||(ph.length&&dg(r.phone).some(x=>ph.includes(x))));
   if(dup&&!confirm('Đã có khách "'+dup.name+'" trùng tên hoặc số điện thoại. Vẫn tạo khách mới?'))return}
  $('dOk').disabled=true;
  const r=c?await sb.from('customers').update(v).eq('id',c.id):await sb.from('customers').insert(v).select('id').single();
  $('dOk').disabled=false;
  if(r.error){$('dErr').textContent=/contact|email|tax_code|column/i.test(r.error.message)?'Chưa cập nhật CSDL: hãy chạy supabase-update-9.sql.':'Không lưu được: '+r.error.message;return}
  $('dlg').close();toast(c?'Đã lưu thông tin':'Đã thêm khách hàng');await loadList();open(c?c.id:r.data.id,1)}}
function editForm(){showForm(cur)}
$('dNo').onclick=()=>$('dlg').close();
$('add').hidden=!boss;$('add').onclick=()=>showForm(null);
function printLedger(){const c=cur,ev=[];if(+c.opening_debt)ev.push({d:'',t:'Nợ đầu kỳ',v:+c.opening_debt});
 D.q.filter(sold).forEach(x=>{ev.push({d:qdate(x),t:'Báo giá '+x.code,v:+x.total});(x.returns||[]).forEach(h=>ev.push({d:h.at,t:'Hoàn kho báo giá '+x.code,v:-h.amount}))});(D.o||[]).filter(x=>x.status==='approved').forEach(x=>{ev.push({d:x.created_at,t:'Phiếu xuất kho'+(x.doc_date?' '+x.doc_date:''),v:+x.value});if(+x.adjusted)ev.push({d:x.created_at,t:'Hoàn kho phiếu xuất'+(x.doc_date?' '+x.doc_date:''),v:-x.adjusted})});D.p.forEach(x=>ev.push({d:x.paid_at,t:'Thanh toán '+x.method+(x.note?' – '+x.note:''),v:-x.amount}));
 ev.sort((a,b)=>String(a.d).localeCompare(String(b.d)));let run=0;const w=window.open('','_blank');if(!w)return toast('Trình duyệt chặn cửa sổ in');
